# ─────────────────────────────────────────────────────────────
# ShopNow — GitHub Actions CI/CD
# Runs on push to main (→ prod) or staging (→ staging).
#
# GitHub secrets to configure (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID     → terraform output jenkins_access_key_id
#   AWS_SECRET_ACCESS_KEY → terraform output -raw jenkins_secret_access_key
#   AWS_ACCOUNT_ID        → your 12-digit AWS account number
#   POSTGRES_PASSWORD     → same value used in terraform.tfvars
# ─────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  PROJECT:      shopnow

jobs:

  # ── Tests ──────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --forceExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --forceExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ── Build & Push ───────────────────────────────────────────
  # Only runs on push to main or staging (not on PRs)
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      env_name:  ${{ steps.meta.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag and environment
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=main-${SHORT_SHA}"     >> $GITHUB_OUTPUT
            echo "env=prod"                  >> $GITHUB_OUTPUT
            echo "alias_tag=latest"          >> $GITHUB_OUTPUT
          else
            echo "tag=staging-${SHORT_SHA}"  >> $GITHUB_OUTPUT
            echo "env=staging"               >> $GITHUB_OUTPUT
            echo "alias_tag=staging"         >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          target: production
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/frontend:${{ steps.meta.outputs.alias_tag }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      - name: Build & push Backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          target: production
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/backend:${{ steps.meta.outputs.alias_tag }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

  # ── Deploy ────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS (${{ needs.build.outputs.env_name }})
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.env_name }}

    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      # prod uses shopnow-cluster, staging uses shopnow-staging-cluster
      ECS_CLUSTER: >-
        ${{ needs.build.outputs.env_name == 'prod'
            && 'shopnow-cluster'
            || 'shopnow-staging-cluster' }}
      PROJECT_PREFIX: >-
        ${{ needs.build.outputs.env_name == 'prod'
            && 'shopnow'
            || 'shopnow-staging' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy Backend
        run: |
          BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/backend:${{ env.IMAGE_TAG }}"

          NEW_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_PREFIX }}-backend \
            --query 'taskDefinition' --output json | \
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' | \
          jq --arg IMG "$BACKEND_IMAGE" '.containerDefinitions[0].image = $IMG' | \
          aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Backend task definition: $NEW_ARN"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service  ${{ env.PROJECT_PREFIX }}-backend \
            --task-definition "$NEW_ARN" \
            --output text > /dev/null

          aws ecs wait services-stable \
            --cluster  ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_PREFIX }}-backend

      - name: Deploy Frontend
        run: |
          FRONTEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/frontend:${{ env.IMAGE_TAG }}"

          NEW_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_PREFIX }}-frontend \
            --query 'taskDefinition' --output json | \
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' | \
          jq --arg IMG "$FRONTEND_IMAGE" '.containerDefinitions[0].image = $IMG' | \
          aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Frontend task definition: $NEW_ARN"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service  ${{ env.PROJECT_PREFIX }}-frontend \
            --task-definition "$NEW_ARN" \
            --output text > /dev/null

          aws ecs wait services-stable \
            --cluster  ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_PREFIX }}-frontend

      - name: Smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --names "${{ env.PROJECT_PREFIX }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")

          if [ -z "$ALB" ] || [ "$ALB" = "None" ]; then
            echo "ALB not found — skipping smoke test"
            exit 0
          fi

          echo "ALB: $ALB"
          for i in $(seq 1 8); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$ALB/health" || echo "000")
            echo "Attempt $i/8 → HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "Smoke test passed"; exit 0; }
            sleep 15
          done

          echo "Smoke test failed after 8 attempts"
          exit 1

      - name: Print service status
        if: always()
        run: |
          aws ecs describe-services \
            --cluster  ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_PREFIX }}-frontend \
                       ${{ env.PROJECT_PREFIX }}-backend \
                       ${{ env.PROJECT_PREFIX }}-postgres \
                       ${{ env.PROJECT_PREFIX }}-redis \
            --query 'services[].{Name:serviceName,Running:runningCount,Desired:desiredCount,Status:status}' \
            --output table
